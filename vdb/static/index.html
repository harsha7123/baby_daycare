<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vision Day Baby</title>
<style>
  :root {
    --bg: #f6f7f9; --card: #fff; --fg: #1d2433; --muted: #5b6475; --line: #e3e6ec;
    --high: #b42318; --high-bg: #fef3f2; --medium: #b54708; --medium-bg: #fffaeb; --ok: #067647; --ok-bg: #ecfdf3;
    --accent: #2f5bd3;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #12151b; --card: #1a1f27; --fg: #e6e9ef; --muted: #98a2b3; --line: #2b323d;
      --high: #f97066; --high-bg: #3a1a18; --medium: #fdb022; --medium-bg: #36270f; --ok: #47cd89; --ok-bg: #0f2a1d;
      --accent: #7a9bff;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; background: var(--bg); color: var(--fg); }
  header { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; padding: 12px 16px; background: var(--card); border-bottom: 1px solid var(--line); }
  header h1 { font-size: 17px; margin: 0 auto 0 0; }
  input, select, button { font: inherit; color: inherit; background: var(--card); border: 1px solid var(--line); border-radius: 6px; padding: 5px 8px; }
  button { cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  main { max-width: 1100px; margin: 0 auto; padding: 16px; }
  h2 { font-size: 14px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 20px 0 8px; }
  .rooms { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px; }
  .room { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 12px; }
  .room .name { font-weight: 600; }
  .room .counts { font-size: 22px; font-variant-numeric: tabular-nums; margin: 4px 0; }
  .pill { display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: 12px; font-weight: 600; }
  .pill.ok { color: var(--ok); background: var(--ok-bg); }
  .pill.high { color: var(--high); background: var(--high-bg); }
  .pill.medium { color: var(--medium); background: var(--medium-bg); }
  .muted { color: var(--muted); }
  .alert { display: grid; grid-template-columns: 120px 1fr; gap: 12px; background: var(--card); border: 1px solid var(--line); border-left: 4px solid var(--line); border-radius: 10px; padding: 10px; margin-bottom: 10px; }
  .alert.high { border-left-color: var(--high); }
  .alert.medium { border-left-color: var(--medium); }
  .alert img { width: 120px; height: 80px; object-fit: cover; border-radius: 6px; background: var(--line); }
  .alert .title { font-weight: 600; }
  .alert .actions { display: flex; flex-wrap: wrap; align-items: flex-start; gap: 6px; margin-top: 6px; }
  .alert video { flex-basis: 100%; width: 100%; max-width: 480px; border-radius: 6px; }
  .status { font-size: 12px; }
  @media (max-width: 520px) { .alert { grid-template-columns: 1fr; } .alert img { width: 100%; height: 160px; } }
</style>
</head>
<body>
<header>
  <h1>Vision Day Baby</h1>
  <select id="site" aria-label="Site"></select>
  <input id="key" type="password" placeholder="API key" aria-label="API key" size="16">
  <button id="connect" class="primary">Connect</button>
  <button id="report">Today's report</button>
  <button id="sound" title="Play a sound for high-severity alerts">Sound: off</button>
  <span id="conn" class="status muted">disconnected</span>
</header>
<main>
  <h2>Rooms</h2>
  <div id="rooms" class="rooms"><p class="muted">Connect to see rooms.</p></div>
  <h2>Alerts</h2>
  <div id="alerts"></div>
</main>
<script src="/static/app.js"></script>
</body>
</html>
