[project]
name = "vdb"
version = "0.1.0"
description = "Vision AI safety monitoring for daycare centres"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "opencv-python-headless",
    "pydantic>=2",
    "pyyaml",
    "supervision",
    "trackers",
    "fastapi[standard]",
    "sqlalchemy[asyncio]>=2",
    "aiosqlite",
    "asyncpg",
    "nats-py",
    "jinja2",
    "imageio-ffmpeg",
    "tzdata",
]

[project.optional-dependencies]
# Torch is installed separately so the right CUDA build is chosen (see README).
ml = ["rfdetr", "transformers"]
dev = ["pytest", "pytest-asyncio", "httpx"]

[project.scripts]
vdb = "vdb.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["vdb*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
